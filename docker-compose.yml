version: "3.8"

services:
  sisa-berapa:
    build: .
    image: sisa-berapa:latest
    container_name: sisa-berapa
    ports:
      - "3300:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET}  # Wajib diisi di file .env
    env_file:
      - .env
    restart: unless-stopped
